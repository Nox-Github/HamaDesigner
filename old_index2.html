<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hama Designer Pro Fas1</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>body{margin:0;font-family:Arial;display:flex;height:100vh}.side{width:280px;background:#f4f4f4;padding:15px;overflow:auto}.main{flex:1;overflow:auto;padding:15px}.palette{display:flex;flex-wrap:wrap;gap:6px}.c{width:30px;height:30px;border:3px solid transparent;cursor:pointer}.sel{border-color:#000}.grid{display:grid;gap:1px;background:#999;width:max-content}.cell,.hdr{width:24px;height:24px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}.hdr{background:#ddd;font-weight:bold}button{margin-top:6px;display:block}</style></head><body><div class='side'><h2>Hama Designer Pro - Fas 1</h2><div id='palette' class='palette'></div><p>Storlek <input id='size' type='number' value='29' min='5' max='150'></p><button onclick='createGrid()'>Skapa rutnät</button><button onclick='exportPDF()'>Exportera PDF</button><button onclick='clearGrid()'>Rensa rutnät</button><div id='info'></div></div><div class='main'><div id='grid' class='grid'></div></div><script>const COLORS=[['Vit','01','#ffffff'],['Röd','05','#ff0000'],['Gul','03','#ffff00'],['Blå','09','#0000ff'],['Grön','10','#00ff00'],['Svart','18','#000000'],['Orange','04','#ff8800'],['Lila','07','#8000ff']];let current='#ff0000',mouse=false;document.body.onmousedown=()=>mouse=true;document.body.onmouseup=()=>mouse=false;COLORS.forEach((x,i)=>{let d=document.createElement('div');d.className='c'+(i==1?' sel':'');d.style.background=x[2];d.title='Hama '+x[1]+' - '+x[0];d.onclick=()=>{document.querySelectorAll('.c').forEach(a=>a.classList.remove('sel'));d.classList.add('sel');current=x[2]};palette.appendChild(d)});function createGrid(){let s=+size.value;grid.innerHTML='';grid.style.gridTemplateColumns=`repeat(${s+1},24px)`;for(let r=0;r<=s;r++){for(let c=0;c<=s;c++){let d=document.createElement('div');if(r==0&&c==0)d.className='hdr';else if(r==0){d.className='hdr';d.textContent=c}else if(c==0){d.className='hdr';d.textContent=String.fromCharCode(64+r)}else{d.className='cell';d.dataset.k=(String.fromCharCode(64+r)+c);d.onclick=()=>paint(d);d.onmouseover=()=>{if(mouse)paint(d)};d.oncontextmenu=(e)=>{e.preventDefault();d.style.background='#ffffff';save();};}grid.appendChild(d)}}load();info.innerHTML=`${s}x${s} | ${s*s} pärlor`}function paint(d){d.style.background=current;save()}function save(){let o={};document.querySelectorAll('.cell').forEach(c=>o[c.dataset.k]=c.style.backgroundColor);localStorage.hama=JSON.stringify(o)}function load(){let o=JSON.parse(localStorage.hama||'{}');document.querySelectorAll('.cell').forEach(c=>{if(o[c.dataset.k])c.style.background=o[c.dataset.k]})}function clearGrid(){localStorage.removeItem('hama');createGrid()}function groupCoordinates(coords){const rows={};coords.forEach(coord=>{const m=coord.match(/^([A-Z]+)(\d+)$/);if(!m)return;(rows[m[1]]||(rows[m[1]]=[])).push(m[2]);});return rows;}async function exportPDF(){const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});const s=+size.value,pitch=5,usableW=190,usableH=260;const cols=Math.floor(usableW/pitch),rows=Math.floor(usableH/pitch);const pagesX=Math.ceil(s/cols),pagesY=Math.ceil(s/rows);const cells=[...document.querySelectorAll('.cell')];let counts={},coordinates={};let p=0;for(let py=0;py<pagesY;py++)for(let px=0;px<pagesX;px++){if(p++)pdf.addPage();pdf.text(`Ark ${p} av ${pagesX*pagesY}`,10,8);pdf.setFontSize(6);for(let c=px*cols;c<Math.min((px+1)*cols,s);c++)pdf.text(String(c+1),16+(c-px*cols)*pitch,13);for(let r=py*rows;r<Math.min((py+1)*rows,s);r++)pdf.text(String.fromCharCode(65+(r%26)),8,18+(r-py*rows)*pitch);for(let r=py*rows;r<Math.min((py+1)*rows,s);r++){for(let c=px*cols;c<Math.min((px+1)*cols,s);c++){let cell=cells[r*s+c];let style=getComputedStyle(cell).backgroundColor;let rgb=style.match(/\d+/g).map(Number);pdf.setFillColor(rgb[0],rgb[1],rgb[2]);pdf.rect(15+(c-px*cols)*pitch,15+(r-py*rows)*pitch,pitch,pitch,'FD');if(style!=='rgb(255, 255, 255)'){counts[style]=(counts[style]||0)+1;const coord=String.fromCharCode(65+r)+(c+1);(coordinates[style]||(coordinates[style]=[])).push(coord);}}}}pdf.addPage();let y=15,total=0;pdf.setFontSize(16);pdf.text('Färglegend',10,y);y+=10;Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(e=>{const rgb=e[0].match(/\d+/g).map(Number);const meta=COLORS.find(cl=>parseInt(cl[2].slice(1,3),16)==rgb[0]&&parseInt(cl[2].slice(3,5),16)==rgb[1]&&parseInt(cl[2].slice(5,7),16)==rgb[2]);total+=e[1];pdf.setFillColor(rgb[0],rgb[1],rgb[2]);pdf.rect(10,y-4,6,6,'F');pdf.rect(10,y-4,6,6);pdf.text(`Hama ${meta?meta[1]:'?'} - ${meta?meta[0]:'Okänd'}`,20,y);pdf.text(`${e[1]} st`,80,y);y+=6;const rowsObj=groupCoordinates(coordinates[e[0]]||[]);for(const row in rowsObj){pdf.text(`Rad ${row}: ${rowsObj[row].join(',')}`,20,y);y+=5;if(y>270){pdf.addPage();y=15;}}y+=4;});pdf.text('Totalt antal pärlor: '+total,10,y+5);pdf.save('Hama_Designer_Pro_Fas1.pdf');}createGrid();</script></body></html>
