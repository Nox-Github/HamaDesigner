<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hama Designer Pro Fas 1.1</title>
<style>
body{margin:0;font-family:Arial,sans-serif;display:flex;height:100vh}
.side{width:280px;background:#f4f4f4;padding:15px;overflow:auto}
.main{flex:1;overflow:auto;padding:15px}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.c{width:30px;height:30px;border:3px solid transparent;cursor:pointer}
.sel{border-color:#000}.grid{display:grid;gap:1px;background:#999;width:max-content;touch-action:none}
.cell,.hdr{width:24px;height:24px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}.hdr{background:#ddd;font-weight:bold}
button{margin-top:6px;display:block}
@media (max-width:768px){body{flex-direction:column;height:auto}.side{width:auto;order:2;position:sticky;bottom:0}.main{order:1;padding:8px}.c{width:40px;height:40px}.cell,.hdr{width:28px;height:28px;font-size:12px}}
</style></head><body>
<div class="side"><h2>Hama Designer Pro - Fas 1.1</h2><div id="palette" class="palette"></div><p>Storlek <input id="size" type="number" value="29"></p><button onclick="createGrid()">Skapa rutnät</button><button onclick="exportPDF()">Exportera PDF</button><button onclick="clearGrid()">Rensa rutnät</button><div id="info"></div></div>
<div class="main"><div id="grid" class="grid"></div></div>
<script>
const COLORS=[['Vit','01','#ffffff'],['Röd','05','#ff0000'],['Gul','03','#ffff00'],['Blå','09','#0000ff'],['Grön','10','#00ff00'],['Svart','18','#000000'],['Orange','04','#ff8800'],['Lila','07','#8000ff'],['Radera','00','#ffffff']];
let current='#ff0000',mouse=false,touching=false;
document.body.onmousedown=()=>mouse=true;document.body.onmouseup=()=>mouse=false;
document.addEventListener('touchstart',()=>touching=true,{passive:false});document.addEventListener('touchend',()=>touching=false);
const palette=document.getElementById('palette');
COLORS.forEach((x,i)=>{let d=document.createElement('div');d.className='c'+(i==1?' sel':'');d.style.background=x[2];d.title='Hama '+x[1]+' - '+x[0];d.onclick=()=>{document.querySelectorAll('.c').forEach(a=>a.classList.remove('sel'));d.classList.add('sel');current=x[2]};palette.appendChild(d);});
function createGrid(){let s=+size.value;grid.innerHTML='';grid.style.gridTemplateColumns=`repeat(${s+1},24px)`;for(let r=0;r<=s;r++){for(let c=0;c<=s;c++){let d=document.createElement('div');if(r==0&&c==0)d.className='hdr';else if(r==0){d.className='hdr';d.textContent=c}else if(c==0){d.className='hdr';d.textContent=String.fromCharCode(64+r)}else{d.className='cell';d.onclick=()=>paint(d);d.onmouseover=()=>{if(mouse)paint(d)};d.oncontextmenu=(e)=>{e.preventDefault();d.style.background='#fff'};d.addEventListener('touchstart',(e)=>{e.preventDefault();paint(d)},{passive:false});d.addEventListener('touchmove',(e)=>{e.preventDefault();const t=e.touches[0];const el=document.elementFromPoint(t.clientX,t.clientY);if(el&&el.classList.contains('cell')) paint(el);},{passive:false});}grid.appendChild(d)}}info.textContent=s+'x'+s;}
function paint(d){d.style.background=current}
function clearGrid(){createGrid()}
function exportPDF(){alert('PDF-export från Fas 1-versionen används fortsatt.');}
createGrid();
</script></body></html>
